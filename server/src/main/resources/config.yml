# ===========================================================================
# MCSA - Minecraft Client-Side AntiCheat  サーバープラグイン設定
# ===========================================================================
# 注意:
#   クライアントから送られてくるレポート（MOD 一覧など）は「自己申告」です。
#   同じ権限を持つ相手は原理的に偽装できるため、ここに書かれた判定は
#   「証拠の重み付け」であって証明ではありません。確定させるには
#   checks.* の行動検知と突き合わせてください。
# ===========================================================================

# クライアントMODとの通信プロトコル版（両側で一致させること）
protocol: 1

# ---------------------------------------------------------------------------
# レポートの改ざん検知（HMAC-SHA256）
# ---------------------------------------------------------------------------
hmac:
  enabled: true
  # クライアントのビルド時に生成された鍵（build/libs/mcsa-client-<ver>-hmac-key.txt）
  # 空のときは検証できないため、すべてのレポートが UNVERIFIED 扱いになる。
  key: ""
  # 検証に失敗したレポートの扱い
  #   FLAG   : レポートは受理して UNVERIFIED フラグを立てる（既定）
  #   REJECT : レポートを捨てる（導入必須判定では「未申告」扱いになる）
  on-invalid: FLAG

# ---------------------------------------------------------------------------
# 導入必須ポリシー
# ---------------------------------------------------------------------------
enforce:
  # OFF      : 導入を求めない（レポートは受け取る）
  # LISTED   : required-players に載っているプレイヤーだけ導入必須（既定）
  # EVERYONE : 全員導入必須
  mode: LISTED
  # LISTED の対象。プレイヤー名または UUID。/ac policy require add <name> でも追加できる
  required-players: []
  # 入室してから導入有無を判定するまでの猶予（tick, 20tick = 1秒）
  grace-ticks: 100
  # 未導入時の処分: KICK / WARN / LOG
  action: KICK
  kick-message: "§c参加するには Better NArena の導入が必要です。\n§7配布ページからダウンロードしてから、もう一度参加してください。"
  warn-message: "§e[Better NArena] §7あなたは導入必須の対象ですが、MODが検出されませんでした。"

# ---------------------------------------------------------------------------
# チャレンジ（レポート要求）
# ---------------------------------------------------------------------------
challenge:
  # 入室から何 tick 後にチャレンジを送るか（クライアントのチャンネル登録待ち）
  delay-ticks: 20
  # 定期再要求の間隔（tick）。0 で無効
  interval-ticks: 6000
  # 収集を求める項目のビットマスク
  #   1=MOD 2=リソースパック 4=シェーダー 8=JVM引数
  collect-flags: 15
  # クライアントに探させる名前（MOD一覧に出ない注入の検知用）。
  # クライアントMODを配り直さずに検知対象を増やせる＝検知候補は動的に増やせる。
  #   完全一致      : meteordevelopment.meteorclient.MeteorClient
  #   prefix:       : prefix:me.rhys           （前方一致）
  #   contains:     : contains:baritone        （部分一致）
  #   regex:        : regex:^net\.wurst.*Client$
  #   class:<上記>  : jar の中のクラス名を走査（ロードされていないものも見つかる）
  #   lib:<上記>    : 読み込み中のライブラリ（jar 名）を照合
  # /ac probe add <pattern> で実行時に追加もできる（config.yml にも書き戻る）
  probe-classes:
    - "prefix:meteordevelopment.meteorclient"
    - "prefix:net.wurstclient"
    - "prefix:net.ccbluex.liquidbounce"
    - "contains:xray"
    - "contains:killaura"

# ---------------------------------------------------------------------------
# クライアント jar そのものの検証
# ---------------------------------------------------------------------------
client:
  # 配布したクライアント jar の SHA-256（/ac policy pin-client <player> で記録できる）
  # 空なら照合しない
  pinned-jar-sha256: ""
  # true にすると、難読化されていないビルドを弾く（配布ビルドは -Pmcsa.obfuscate=true で作ること）
  require-obfuscated: false

# ---------------------------------------------------------------------------
# MOD / リソースパック / シェーダーの判定
# ---------------------------------------------------------------------------
policy:
  # 見つけたら即アウト（MOD id。ワイルドカード * 可）
  banned-mods:
    - meteor-client
    - wurst
    - liquidbounce
    - impact
    - forcecraft
    - xray
  # 見つけたら警告（自動ツール系など、サーバーごとに判断が分かれるもの）
  suspicious-mods:
    - baritone
    - minimap
    - xaerominimap
    - litematica
    - freecam
    - click-assist
  # 明示的に許可する id（unknown 扱いを避けたいとき）
  allowed-mods: []
  # true にすると、どのリストにも無い MOD を UNKNOWN_MOD として記録する
  flag-unknown-mods: false
  banned-shaders: []
  banned-resource-packs: []
  # critical フラグが出たときの処分: KICK / FLAG / LOG
  # ※ 1.0.33 以降、UNVERIFIED（hmac.key の設定不一致）と CLIENT_TAMPERED
  #   （pinned-jar-sha256 の更新忘れ）は「運用側の設定起因」として KICK 対象から
  #   除外される（フラグとアラートは立つ。原因はコンソールに対処法付きで出る）。
  #   キック時にはプレイヤーにもフラグ名が併記される。
  on-banned: KICK
  banned-kick-message: "§cこのサーバーで許可されていないMOD/パックが検出されました。"
  # MOD id の偽装検知に使うピン留めは pins.yml（/ac policy pin で生成）

# ---------------------------------------------------------------------------
# アラート
# ---------------------------------------------------------------------------
alerts:
  console: true
  broadcast: true
  broadcast-permission: mcsa.alerts
  # Discord などの Webhook URL（空で無効）。レポートの JSON 要約を POST する
  webhook: ""

storage:
  # plugins/MCSA/reports/<uuid>.json にレポートを保存する
  save-reports: true

# ---------------------------------------------------------------------------
# サーバー側の行動検知
#   クライアントの自己申告が偽装されていても、こちらはサーバー権限で観測できる。
#   誤検知を避けるため、初期値はかなり緩めにしてある。まず LOG/アラートで
#   様子を見てから cancel や kick-vl を有効化すること。
# ---------------------------------------------------------------------------
checks:
  enabled: true
  # イベントをキャンセルして挙動を打ち消すか（reach のみ対象）
  cancel: false
  # この違反レベルでアラート
  alert-vl: 5
  # この違反レベルでキック（0 = キックしない）
  kick-vl: 0
  kick-message: "§c不正な挙動が検出されました (Better NArena)"
  reach:
    enabled: true
    max-reach: 3.1
    ping-compensation: true
  killaura:
    enabled: true
    max-angle: 75.0
    max-hits-per-second: 16
  autoclicker:
    enabled: true
    max-cps: 20
    # クリック間隔のばらつきがこの値未満なら機械的とみなす（ミリ秒）
    min-interval-deviation-ms: 8.0
    min-samples: 12
  fastbreak:
    enabled: true
    max-breaks-per-second: 20
  fly:
    enabled: true
    min-air-ticks: 30
  speed:
    enabled: true
    # 1 tick あたりの水平移動量（スプリントで約 0.28）
    max-per-tick: 0.6
    max-ticks: 10

# ---------------------------------------------------------------------------
# 注入検知（Mixin / javaagent / ライブラリ名 / jar の中身）
#   クライアントは「何が引っかかったか」だけを送り、判定はここで行う。
#   Fabric 自体が Mixin を使うので、Mixin の存在だけでは何も判定しない。
#   「出所不明の Mixin 設定」＋「注入痕跡」の組み合わせが本命。
# ---------------------------------------------------------------------------
injection:
  enabled: true
  # インストール済みMODのどれにも属さない Mixin 設定を重大扱いにする
  unknown-mixin-critical: true
  # 怪しい名前のライブラリ（byte-buddy / javassist 等）だけで重大扱いにするか。
  # 正当なMODも使うので既定は false（参考情報として /ac info には出る）
  library-critical: false
  thread-critical: true
  classloader-critical: true
  # ゲームプレイ関連クラスへの注入痕跡がこの数以上なら「注入あり」とみなす
  injected-member-threshold: 40
  # MOD が入っているのに Mixin 設定が 0 件＝観測を潰されている疑いとして報告
  require-mixin-configs: true

# ---------------------------------------------------------------------------
# 証拠（画面の取得）
#   /ac shot <player> [reason] で OP が指示 → クライアントが画面を送る。
#   対象プレイヤーの画面には何も表示しない（逃走されると証拠が消えるため）。
#   保存先は plugins/MCSA/evidence/<player>-<uuid8>/、監査ログは evidence-log.txt。
#
#   【重要】画面は個人情報です。既定は無効。有効にする前に
#   サーバールール／利用規約で「不正調査のために画面を取得・保存する場合がある」
#   ことを告知してください（docs/PRIVACY.md に文例あり）。
# ---------------------------------------------------------------------------
evidence:
  capture:
    enabled: false
    # 同じプレイヤーへの取得要求の最小間隔（秒）。乱用防止
    min-interval-seconds: 5
  # 受け付ける証拠の最大バイト数
  max-bytes: 8388608
  # 受信を OP（alerts.broadcast-permission 持ち）に通知する
  notify: true
  # 保持日数。0 で自動削除しない。/ac reload でも整理が走る
  retention-days: 0

# ---------------------------------------------------------------------------
# 常時監視（ウォッチドッグ）
#   「起動時だけ正常な顔をする」タイプへの対策。
#   クライアントは一定間隔で状態ダイジェストを送り続け、サーバーは
#   「内容が変わった」「送ってこなくなった」の両方を証拠にする（2段階認証と同じ発想）。
# ---------------------------------------------------------------------------
watchdog:
  enabled: true
  # サーバー側の監視間隔（tick, 20tick = 1秒）
  check-ticks: 200
  # ダイジェストがこれ以上途切れたら「MOD が停止された」とみなす（秒）
  timeout-seconds: 180
  # 実行時の状態変化で即キックするか。既定は false（まず証拠を集める）
  kick-on-change: false
  watch:
    # /ac watch <player> <seconds> で指定できる上限
    max-seconds: 1800
    # 監視モード中のダイジェスト間隔（秒）
    digest-interval-seconds: 20
    # 監視モード中の定期画面取得の間隔（秒）。0 で定期取得なし（手動の /ac shot だけ使う）
    # evidence.capture.enabled=false なら定期・手動どちらも撮らない
    capture-interval-seconds: 0

# ---------------------------------------------------------------------------
# プライバシィ告知（同意）
#   クライアント MOD は起動時に英文のプライバシィ告知を出し、
#   同意するまでプレイできない（拒否すると Minecraft が終了する）。
#   同意の事実（文面の指紋と時刻）はレポートに乗ってくる。
#   告知文面は config/mcsa/privacy-notice.txt（クライアント側）。
# ---------------------------------------------------------------------------
consent:
  required: true
  # 運営が配っている文面の SHA-256（先頭 12 文字）。
  # 空ならどの版の同意でも受理する。設定すると違う文面に同意しているクライアントに
  # CONSENT_NOTICE_MISMATCH を立てる（告知を更新したら合わせること）
  notice-hash: ""
