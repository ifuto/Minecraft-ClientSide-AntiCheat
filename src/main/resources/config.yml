# ============================================================
#  HeartSMP
#  Paper 1.21.x 用 SMP プラグイン
#  ・ハート(最大体力)の受け渡し
#  ・Combat タグ / ログアウト処理
#  ・カスタムのキルログ・参加退出メッセージ
#  ・TPA / いふと配送 / RTP / 運営コマンド
#
#  メッセージはすべて MiniMessage 記法です。
#  色: <#ff0000> / <red> / <bold> / <obfuscated> など
#  プレースホルダは %name% 形式です。
# ============================================================

settings:
  combat:
    # Combat が切れるまでの秒数
    duration-seconds: 30
    # アクションバーを更新する間隔(tick)
    actionbar-interval-ticks: 10
    # Combat 中はエリトラ (滑空) を使用不可にする
    block-elytra: true
  hearts:
    default: 10
    min: 1
    max: 30
  death:
    # Combat 中にログアウトしたときにアイテムを散らばせる半径(ブロック)
    logout-scatter-radius: 4.0
    # プレイヤーが死亡したときのドロップ品を追跡するためのタグ
    track-drops: true
  damage:
    # TNT トロッコのダメージ倍率(80%)
    tnt-minecart-multiplier: 0.8
    # メイスの防具貫通(Breach)を 1 レベルごとに何割減らすか
    # バニラは 1 レベル 15% 貫通 -> 本プラグインでは 1 レベル 11% 貫通
    mace-breach-reduction-per-level: 0.04
  tpa:
    request-lifetime-seconds: 50
    resend-cooldown-seconds: 30
    post-teleport-cooldown-seconds: 300
    abort-cooldown-seconds: 15
    countdown-seconds: 3
    # カウントダウン中にこれ以上動いたら中止(ブロック)
    move-threshold: 0.3
  delivery:
    base-cost: 3
    fast-cost: 6
    travel-seconds: 120
    max-pending-per-sender: 3
    max-bagages: 21
    # 配送規約違反で送れないアイテム
    banned-materials:
      - FLINT
      - FLINT_AND_STEEL
      - TNT
      - FIREWORK_ROCKET
      - END_CRYSTAL
      - GUNPOWDER
      - LIGHTNING_ROD
      - OMINOUS_BOTTLE
  rtp:
    normal-cooldown-seconds: 40
    cave-cooldown-seconds: 300
    biome-cooldown-seconds: 180
    # 探索する最大試行回数
    max-attempts: 60
    normal-min-radius: 300
    normal-max-radius: 3000
    cave-min-y-offset: 0
    cave-max-y: 40
  rollback:
    # 1 プレイヤーあたり保存する死亡ログの最大件数
    max-records-per-player: 40

# ------------------------------------------------------------
# ランク
# ------------------------------------------------------------
ranks:
  default:
    display: DEFAULT
    name-color: '<#ffffff>'
  vip:
    display: VIP
    name-color: '<#7aff59>'
  vip-plus:
    display: 'VIP+'
    name-color: '<#ffd24d>'

