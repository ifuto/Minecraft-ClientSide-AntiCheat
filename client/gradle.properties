# client/ 単体ビルド用の既定値（ルートの gradle.properties と同じ値を維持すること）
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.6
loader_version=0.19.5
fabric_version=0.141.6+1.21.11
loom_version=1.18.2
modmenu_version=

# ビルド毎に上げる（trigger.md の build: と同じ番号にする）。
# jar 名・MOD 一覧のバージョン・/ac info の modVersion に反映される。
mcsa_version=1.0.25
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# 配布ビルドは難読化する（ローカルで無効化したいときは -Pmcsa.obfuscate=false）
mcsa.obfuscate=true
