plugins {
    // Loom 1.14 以降のプラグイン ID（旧 'fabric-loom' は 1.18 でバリアントが解決できない）
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'java'
}

version = project.findProperty('mcsa_version') ?: '1.0.0'
group = 'dev.ifuto.mcsa'
base.archivesName = 'mcsa-client'

repositories {
    mavenCentral()
}

configurations {
    proguardCp
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    proguardCp 'com.guardsquare:proguard-gradle:7.6.1'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}

processResources {
    def v = project.version
    inputs.property 'version', v
    filesMatching('fabric.mod.json') {
        expand 'version': v
    }
    filesMatching('assets/mcsa/lang/*.json') {
        expand 'version': v
    }
}

// ---------------------------------------------------------------------------
// HMAC 鍵素材の生成
//   レポートの改ざん検知に使う 32 バイト鍵をビルドごとに生成し、
//   XOR マスクを掛けた int 配列として Java ソースを生成する。
//   平文の文字列定数は jar に残らない（strings で拾えない）。
//
//   生成された鍵は
//     - client/hmac-key.txt          （次回ビルドで再利用。Git 管理外）
//     - build/libs/*-hmac-key.txt    （成果物と一緒に配布。サーバ設定に貼る）
//   に出力される。サーバ側 config.yml の hmac.key に同じ値を設定すること。
// ---------------------------------------------------------------------------
def hmacKeyFile = layout.projectDirectory.file('hmac-key.txt')
def keySrcDir = layout.buildDirectory.dir('generated/sources/mcsaKey/java')

def toHex(byte[] b) {
    def sb = new StringBuilder(b.length * 2)
    for (byte x : b) sb.append(String.format('%02x', x))
    return sb.toString()
}

def fromHex(String s) {
    def out = new byte[s.length() / 2 as int]
    for (int i = 0; i < out.length; i++) {
        out[i] = (byte) Integer.parseInt(s.substring(i * 2, i * 2 + 2), 16)
    }
    return out
}

tasks.register('generateKeyMaterial') {
    outputs.dir(keySrcDir)
    doLast {
        def rnd = new java.security.SecureRandom()
        byte[] key
        def f = hmacKeyFile.asFile
        if (f.exists() && f.text.trim().length() == 64) {
            key = fromHex(f.text.trim())
            logger.lifecycle('[MCSA] 既存の HMAC 鍵を再利用します: {}', f)
        } else {
            key = new byte[32]
            rnd.nextBytes(key)
            f.text = toHex(key) + '\n'
            logger.lifecycle('[MCSA] 新しい HMAC 鍵を生成しました: {}', f)
        }

        byte[] mask = new byte[32]
        rnd.nextBytes(mask)
        def xored = new byte[32]
        for (int i = 0; i < 32; i++) {
            xored[i] = (byte) (key[i] ^ mask[i])
        }

        def pkgDir = new File(keySrcDir.get().asFile, 'dev/ifuto/mcsa/client/gen')
        pkgDir.mkdirs()
        def src = new StringBuilder()
        src.append('package dev.ifuto.mcsa.client.gen;\n\n')
        src.append('/** ビルド時に生成される鍵素材。ソースツリーには存在しない。 */\n')
        src.append('public final class KeyMaterial {\n')
        src.append('    private static final int[] A = {').append(xored.collect { (it & 0xFF) as int }.join(', ')).append('};\n')
        src.append('    private static final int[] B = {').append(mask.collect { (it & 0xFF) as int }.join(', ')).append('};\n')
        src.append('    private static byte[] cached;\n\n')
        src.append('    private KeyMaterial() {}\n\n')
        src.append('    public static synchronized byte[] key() {\n')
        src.append('        if (cached == null) {\n')
        src.append('            cached = new byte[A.length];\n')
        src.append('            for (int i = 0; i < A.length; i++) {\n')
        src.append('                cached[i] = (byte) (A[i] ^ B[i]);\n')
        src.append('            }\n')
        src.append('        }\n')
        src.append('        return cached.clone();\n')
        src.append('    }\n')
        src.append('}\n')
        new File(pkgDir, 'KeyMaterial.java').setText(src.toString(), 'UTF-8')

        def libs = layout.buildDirectory.dir('libs').get().asFile
        libs.mkdirs()
        new File(libs, "${base.archivesName.get()}-${version}-hmac-key.txt").text = toHex(key) + '\n'
        logger.lifecycle('[MCSA] HMAC 鍵 (サーバの config.yml に設定する値): {}', toHex(key))
    }
}

sourceSets.main.java.srcDir(keySrcDir)
tasks.named('compileJava') { dependsOn 'generateKeyMaterial' }

// ---------------------------------------------------------------------------
// 成果物の検証
//   fabric.mod.json の entrypoints が指すクラスが実際に jar に入っているかを
//   ビルド時に確認する（難読化でエントリーポイントを消す事故の防止）。
// ---------------------------------------------------------------------------
def verifyModJar = { File jarFile ->
    if (!jarFile.exists()) {
        throw new GradleException("成果物が見つかりません: ${jarFile}")
    }
    def names = []
    def manifestJson = null
    new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
        zip.entries().each { entry ->
            names << entry.name
            if (entry.name == 'fabric.mod.json') {
                manifestJson = zip.getInputStream(entry).getText('UTF-8')
            }
        }
    }
    if (manifestJson == null) {
        throw new GradleException("fabric.mod.json が jar に入っていません: ${jarFile}")
    }
    def manifest = new groovy.json.JsonSlurper().parseText(manifestJson)
    def required = []
    manifest.entrypoints.each { key, value ->
        (value instanceof List ? value : [value]).each { entry ->
            def className = (entry instanceof String ? entry : entry.value).toString()
            required << className.replace('.', '/') + '.class'
        }
    }
    def missing = required.findAll { !names.contains(it) }
    logger.lifecycle("[MCSA] jar 検証: {} = {} エントリ / エントリーポイント {} 件 / id={}",
            jarFile.name, names.size(), required.size(), manifest.id)
    if (manifest.id != 'mcsa') {
        throw new GradleException("fabric.mod.json の id が mcsa ではありません: ${manifest.id}")
    }
    if (!missing.isEmpty()) {
        throw new GradleException("エントリーポイントのクラスが jar にありません: ${missing}")
    }
    if (jarFile.length() < 10_000) {
        throw new GradleException("jar が小さすぎます（ビルドが壊れている可能性）: ${jarFile.length()} bytes")
    }
}

// ---------------------------------------------------------------------------
// StackMapTable の検証（VerifyError 予防）
//   Java 6+ (version >= 50) のクラスファイルは、分岐を持つメソッドに
//   StackMapTable 属性が必須。ProGuard に -dontpreverify を付けると書かれなく
//   なり、「ビルドは通るが起動直後に VerifyError で落ちる」jar ができる。
//   JDK 24+ の ClassFile API（Gradle 実行 JVM 上）で機械的に確認する。
// ---------------------------------------------------------------------------
def BRANCH_OPCODES = ['IFEQ', 'IFNE', 'IFLT', 'IFGE', 'IFGT', 'IFLE',
                      'IF_ICMPEQ', 'IF_ICMPNE', 'IF_ICMPLT', 'IF_ICMPGE', 'IF_ICMPGT', 'IF_ICMPLE',
                      'IF_ACMPEQ', 'IF_ACMPNE', 'IFNULL', 'IFNONNULL',
                      'GOTO', 'GOTO_W', 'TABLESWITCH', 'LOOKUPSWITCH'] as Set

def verifyStackMaps = { File jarFile ->
    def classFileApi
    try {
        classFileApi = Class.forName('java.lang.classfile.ClassFile').getMethod('of').invoke(null)
    } catch (Throwable ignored) {
        logger.warn('[MCSA] StackMapTable 検証をスキップ: 実行 JVM に ClassFile API がありません' +
                '（Gradle を JDK 24+ で実行してください）')
        return
    }
    def parse = Class.forName('java.lang.classfile.ClassFile').getMethod('parse', byte[])
    def smtClass = Class.forName('java.lang.classfile.attribute.StackMapTableAttribute')
    def codeClass = Class.forName('java.lang.classfile.attribute.CodeAttribute')
    def bad = []
    int checked = 0
    new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
        Collections.list(zip.entries()).each { entry ->
            if (!entry.name.endsWith('.class')) {
                return
            }
            def model
            def bytes
            try {
                bytes = zip.getInputStream(entry).readAllBytes()
                model = parse.invoke(classFileApi, bytes)
            } catch (Throwable t) {
                String head = '(empty)'
                if (bytes != null && bytes.length > 0) {
                    StringBuilder sb = new StringBuilder()
                    int n = Math.min(16, bytes.length)
                    for (int i = 0; i < n; i++) {
                        if (i > 0) {
                            sb.append(' ')
                        }
                        sb.append(String.format('%02x', bytes[i]))
                    }
                    head = sb.toString()
                }
                String cause = t.cause ? " / cause: ${t.cause}" : ''
                bad << "${entry.name}: ${t.class.simpleName}: ${t.message ?: '(no message)'}${cause} [size=${bytes ? bytes.length : 0}, head: ${head}]"
                return
            }
            model.methods().each { m ->
                def code = m.attributes().find { codeClass.isInstance(it) }
                if (code == null) {
                    return
                }
                checked++
                def hasBranch = false
                code.elementList().each { el ->
                    def op
                    try {
                        op = el.opcode()
                    } catch (Throwable ignored) {
                        return
                    }
                    if (op != null && BRANCH_OPCODES.contains(op.name())) {
                        hasBranch = true
                    }
                }
                if (hasBranch && !code.attributes().any { smtClass.isInstance(it) }) {
                    def methodName
                    try {
                        methodName = m.methodName().stringValue()
                    } catch (Throwable ignored) {
                        methodName = '?'
                    }
                    bad << "${entry.name} の ${methodName}(): 分岐があるのに StackMapTable が無い"
                }
            }
        }
    }
    if (!bad.isEmpty()) {
        throw new GradleException("StackMapTable が欠けています（この jar は起動直後に VerifyError で落ちます）: ${jarFile.name}\n  " + bad.take(3).join('\n  ') + (bad.size() > 3 ? '\n  ... ほか ' + (bad.size() - 3) + ' 件' : ''))
    }
    logger.lifecycle("[MCSA] StackMapTable 検証OK: ${jarFile.name}（メソッド ${checked} 件）")
}

tasks.register('verifyJar') {
    group = 'verification'
    description = 'remapJar の成果物を検証する'
    dependsOn 'remapJar'
    doLast {
        def plain = layout.buildDirectory.file("libs/${base.archivesName.get()}-${version}.jar").get().asFile
        verifyModJar(plain)
        verifyStackMaps(plain)
    }
}
tasks.named('build') { dependsOn 'verifyJar' }

// ---------------------------------------------------------------------------
// 難読化（ProGuard）  -Pmcsa.obfuscate=true で build に組み込まれる
//   Loom の remapJar 出力（intermediary 名になった jar）に対して掛ける。
// ---------------------------------------------------------------------------
def obfuscateEnabled = (project.findProperty('mcsa.obfuscate') ?: 'false').toString().toBoolean()

tasks.register('obfuscateJar', JavaExec) {
    group = 'build'
    description = 'remapJar の出力に ProGuard を適用する'
    dependsOn 'remapJar'

    def inJar = layout.buildDirectory.file("libs/${base.archivesName.get()}-${version}.jar")
    def outJar = layout.buildDirectory.file("libs/${base.archivesName.get()}-${version}-obf.jar")
    inputs.file(inJar)
    outputs.file(outJar)

    classpath = configurations.proguardCp
    mainClass = 'proguard.ProGuard'

    doFirst {
        def libs = javaLibraryJars()
        sourceSets.main.compileClasspath.files.each {
            if (it.exists()) libs << it.absolutePath
        }
        def a = ['-injars', inJar.get().asFile.absolutePath,
                 '-outjars', outJar.get().asFile.absolutePath]
        libs.each { a << '-libraryjars' << it }
        a << "@${file('proguard.pro').absolutePath}"
        args = a
    }
    doLast {
        // 難読化でエントリーポイントが消えていないことと、
        // StackMapTable が欠けていないこと（起動時 VerifyError の予防）を確認する
        verifyModJar(outJar.get().asFile)
        verifyStackMaps(outJar.get().asFile)
    }
}

/**
 * ProGuard に渡すライブラリ。
 *
 * Java 標準ライブラリ（java.base）はあえて渡さない。
 * Fabric Loom 1.18 は Gradle の実行に JDK 25 を要求するが、ProGuard 7.6.1 が読める
 * クラスファイルは Java 23（version 67）までなので、JDK 25 の jmods / jimage を
 * 渡すと「Unsupported version number [69.0]」で落ちる。
 * 縮約も最適化もしていない（リネームのみ）ため、java.* が解決できなくても
 * 成果物には影響しない。参照は proguard.pro の -dontwarn / -ignorewarnings で抑止する。
 */
def javaLibraryJars() {
    logger.lifecycle('[MCSA] ProGuard: ライブラリは Minecraft / Fabric のコンパイルクラスパスのみを使います' +
            '（java.base は JDK 25 のクラスファイルを ProGuard が読めないため渡さない）')
    return []
}

if (obfuscateEnabled) {
    tasks.named('build') { dependsOn 'obfuscateJar' }
    logger.lifecycle('[MCSA] 難読化を有効化しました (build/libs/*-obf.jar)')
}
