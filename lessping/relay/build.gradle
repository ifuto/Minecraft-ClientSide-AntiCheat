plugins {
    id 'java'
}

version = project.findProperty('lessping_version') ?: '0.1.0'
group = 'dev.ifuto.lessping'
base.archivesName = 'lessping-narena-relay'

def mcVersion = project.findProperty('minecraft_version') ?: '1.21.11'
def paperApi = project.findProperty('paper_api_version') ?: "${mcVersion}-R0.1-SNAPSHOT"
def apiVersion = project.findProperty('plugin_api_version') ?: (mcVersion.toString().split('\\\\.')[0..1].join('.'))

// MOD 側と共有する純粋 Java のプロトコル実装（LpxFrame / LpxStream / Stun / LpSecret）。
// このフォルダには Minecraft に依存するクラスは無いのでプラグインからも直接コンパイルする
sourceSets {
    main {
        java {
            srcDir '../src/main/java/dev/ifuto/lessping/tunnel/lpx'
        }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}

dependencies {
    compileOnly "io.papermc.paper:paper-api:${paperApi}"
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}

processResources {
    def v = project.version
    def api = apiVersion
    inputs.property 'version', v
    inputs.property 'apiVersion', api
    filesMatching('plugin.yml') {
        expand 'version': v, 'apiVersion': api
    }
}

tasks.register('printCoordinates') {
    doLast {
        logger.lifecycle("[LessPing] paper-api=${paperApi} api-version=${apiVersion} version=${version}")
    }
}
tasks.named('build') { dependsOn 'printCoordinates' }
