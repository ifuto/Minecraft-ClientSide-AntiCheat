plugins {
    id 'java'
}

version = project.findProperty('lessping_version') ?: '0.1.0'
group = 'dev.ifuto.lessping'
base.archivesName = 'lessping-narena-relay'

def velocityApi = project.findProperty('velocity_api_version') ?: '4.2.0'

// MOD 側と共有する純粋 Java のプロトコル実装（LpxFrame / LpxStream / Stun / LpSecret）。
// このフォルダには Minecraft に依存するクラスは無いのでプラグインからも直接コンパイルする
sourceSets {
    main {
        java {
            srcDir '../src/main/java/dev/ifuto/lessping/tunnel/lpx'
        }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}

dependencies {
    compileOnly "com.velocitypowered:velocity-api:${velocityApi}"
    annotationProcessor "com.velocitypowered:velocity-api:${velocityApi}"
}

// velocity-api 4.x は Java 25 専用（org.gradle.jvm.version=25）なので、
// このプラグインも release 25 でコンパイルする。Velocity 4.x プロキシは
// それ自体が Java 25 で動くため、実行環境としても問題ない
tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = 'UTF-8'
}

processResources {
    def v = project.version
    inputs.property 'version', v
    filesMatching('velocity-plugin.json') {
        expand 'version': v
    }
}

tasks.register('printCoordinates') {
    doLast {
        logger.lifecycle("[LessPing] velocity-api=${velocityApi} version=${version}")
    }
}
tasks.named('build') { dependsOn 'printCoordinates' }
