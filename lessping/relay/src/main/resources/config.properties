# ===========================================================================
# LessPing-NArena 中継プラグイン（Velocity）設定
# ===========================================================================
# このプラグインは「シグナリング」と「ホスト側トンネル端末」を担当します:
#   1. LessPing MOD 入りのプレイヤー（SMP / PvP どちらにいても）から HELLO を受け、
#      INTRO_REQUEST で両者を紹介し合う（ゲーム通信は経由しない）
#   2. このサーバー(Proxy)と同じ PC 上で P2P トンネルの受け口を務める。
#      サーバー主がゲームを起動していなくても、参加者が「narena」に接続するだけで
#      この PC の Velocity へ直接届く
#
# 編集したら Velocity を再起動（/velocity reload では反映されません）
# ===========================================================================

# 紹介のやり取りをコンソールに詳細ログを出すか
debug=false

# ゲーム内 INTRO のエントリ鮮度（ミリ秒）
freshness-ms=600000

# --- ホスト側トンネル端末 ---------------------------------------------------

# ホスト端末を有効にするか
host-endpoint.enabled=true

# UDP ポート（0 = 自動）
host-endpoint.udp-port=0

# トンネルで受けた接続の転送先。空 = この Velocity 自身（bind アドレスとポート）。
# 基本は空のままで OK（SMP も PvP も /server で移動できる）
host-endpoint.backend=

# 共有鍵。設定すると:
#   - 正しいトークンの PUNCH だけを受け付ける
#   - ping に載せるアドレス情報もマスクされる
# 参加者の MOD 側 (config/lessping/client.json の secret) と同じ値を設定する。
# 空のままなら、サーバーアドレスを知る人なら誰でもトンネルを張れる
host-endpoint.secret=

# 自分のアドレスを調べる STUN サーバー（カンマ区切り）
host-endpoint.stun-servers=stun.cloudflare.com:3478,stun.l.google.com:19302

# STUN 更新間隔（ミリ秒）。NAT マップの維持も兼ねる
host-endpoint.stun-interval-ms=30000

# サーバーリスト ping に候補を載せるか（false にするとゲーム内 INTRO 経由のみ）
host-endpoint.publish=true

# 同時に受け付けるトンネル接続（Minecraft 接続）の上限
host-endpoint.max-connections=32
