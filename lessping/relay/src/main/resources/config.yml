# ===========================================================================
# LessPing-NArena 中継プラグイン設定
# ===========================================================================
# このプラグインは「シグナリング」だけを担当します:
#   1. プレイヤー（LessPing MOD 入り）が参加すると HELLO で自分のアドレスを登録
#   2. 誰かが「このプレイヤーへのトンネルを張りたい」と要求（INTRO_REQUEST）
#   3. 両者へ相手のアドレスを紹介（INTRO）→ 両者は UDP で直接 hole punch する
#
# このサーバーが中継するのは「アドレスの紹介」だけで、ゲーム通信は流れません
# （P2P トンネル確立後はこのサーバーも経由しません）。
# ===========================================================================

# 紹介のやり取りをコンソールに詳細ログを出すか
debug: false

# エントリの鮮度（ミリ秒）。これを過ぎた HELLO 情報は紹介しない
# （MOD は参加のたびに再送するので、長時間ログインでも実害はない）
freshness-ms: 600000

# ===========================================================================
# ホスト側トンネル端末（v0.2.0〜）
# ===========================================================================
# このプラグイン自身が、サーバーPC 上で P2P トンネルの受け口を務めます。
# サーバー主がゲームを起動していなくても、参加者が「narena」に接続するだけで
# この PC の Paper へ直接届きます（ゲーム通信がこのサーバーを経由することは
# ありません。UDP ホールパンチで参加者と直接つながります）。
#
# 仕組み: プラグインが STUN で自分の UDP アドレスを調べ、サーバーリスト ping の
# 応答（version 名）に載せて公開します。参加者の MOD はクライアント起動直後に
# それを読んで穴あけを始めるため、本サーバーに入る必要がありません。
# ===========================================================================
host-endpoint:
  # ホスト端末を有効にするか
  enabled: true

  # UDP ポート（0 = 自動）
  udp-port: 0

  # トンネルで受けた接続の転送先。空ならサーバー自身（bind アドレスとポート）
  # 別の Paper へ流したいときだけ "127.0.0.1:25565" のように指定
  backend: ""

  # 共有鍵。設定すると:
  #   - 正しいトークンの PUNCH だけを受け付ける
  #   - ping に載せるアドレス情報もマスクされる
  # 参加者の MOD 側 (config/lessping/client.json の secret) と同じ値を設定する。
  # 空のままなら誰でも（サーバーアドレスを知る人なら）トンネルを張れる
  # （= 本サーバーのアドレスを知っている人と同じ範囲）
  secret: ""

  # 自分のアドレスを調べる STUN サーバー
  stun-servers:
    - "stun.cloudflare.com:3478"
    - "stun.l.google.com:19302"

  # STUN 更新間隔（ミリ秒）。NAT マップの維持も兼ねる
  stun-interval-ms: 30000

  # サーバーリスト ping に候補を載せるか（false にするとゲーム内 INTRO 経由のみ）
  publish: true

  # 同時に受け付けるトンネル接続（Minecraft 接続）の上限
  max-connections: 32
