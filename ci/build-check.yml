name: Build Check

# 2026-09-20 更新: client のビルドに GitHub Secrets の MCSA_HMAC_SEED を渡すようにした。
# （Secret を設定すると Multi Build と Build Check で同じ HMAC 鍵が決定論的に導出され、
#   違うワークフローの jar と鍵ファイルを取り違えて UNVERIFIED になる事故が消える）
# .github/workflows/build-check-2.yml へコピーして使う。

# client/（Fabric MOD）・admin/（OP 用 MOD）・server/（Paper プラグイン）を
# すべて実際にコンパイルする CI。
#
# リポジトリの Multi Build / Multi Build (Paper) は trigger.md の workdir を
# 共有しているため 1 回の push では 1 プロジェクトしか見ない。こちらは 3 つを
# 並列で見るので、こっちを .github/workflows/ に置くのがおすすめ。
#
# 失敗時は javac のエラー行をチェックのアノテーションに出す
# （Actions のログは取得できない環境からでも読めるようにするため）。

on:
  push:
    branches: ["**"]
    paths:
      - "client/**"
      - "admin/**"
      - "server/**"
      - "tools/**"
      - "gradle.properties"
      - ".github/workflows/build-check.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_VERSION: "9.7.1"
  # Loom 1.18.2 は Gradle の実行に JDK 25 を要求する（成果物は Java 21 バイトコード）
  JAVA_VERSION: "25"

jobs:
  contract:
    name: 契約チェック（クライアント／サーバーの整合性）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: プロトコルの整合（チャンネル名・JSON キー・config キー）
        run: python3 tools/verify_protocol.py
      - name: Java ソースの整合（括弧・import・呼び出し先）
        run: python3 tools/check_java_syntax.py

  client:
    name: Client MOD（Fabric）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: ビルド（難読化込み）
        working-directory: client
        env:
          # GitHub Secrets に MCSA_HMAC_SEED を設定すると全ワークフローで同一鍵。
          MCSA_HMAC_SEED: ${{ secrets.MCSA_HMAC_SEED }}
        run: |
          set -o pipefail
          gradle build --no-daemon --stacktrace 2>&1 | tee build-log.txt

      - name: 成果物の中身を確認
        working-directory: client
        run: |
          set -euo pipefail
          ls -l build/libs
          # mcsa-client-*.jar は難読化版 (-obf) にも一致するので、それぞれ 1 本ずつ選ぶ
          PLAIN=$(ls build/libs/mcsa-client-*.jar | grep -v -- '-obf\.jar$' | head -1)
          OBF=$(ls build/libs/mcsa-client-*-obf.jar | head -1)
          echo "plain=$PLAIN obf=$OBF"
          # fabric.mod.json とエントリーポイントが入っていること
          unzip -l "$PLAIN" | grep -E 'fabric\.mod\.json|McsaClient\.class|KeyMaterial\.class'
          # 難読化ビルドでも fabric.mod.json とエントリーポイントが残っていること
          unzip -l "$OBF" | grep -E 'fabric\.mod\.json|McsaClient\.class'
          unzip -p "$OBF" fabric.mod.json | head -20

      - name: "失敗時: エラーをアノテーション化"
        if: failure()
        run: bash ci/annotate.sh client/build-log.txt; ls -lR client/build/libs || true

      - uses: actions/upload-artifact@v4
        with:
          name: mcsa-client
          path: |
            client/build/libs/*.jar
            client/build/libs/*hmac-key.txt
          if-no-files-found: error

  admin:
    name: OP 用 MOD（Fabric）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: ビルド
        working-directory: admin
        run: |
          set -o pipefail
          gradle build --no-daemon --stacktrace 2>&1 | tee build-log.txt

      - name: 成果物の一覧
        run: ls -lR admin/build/libs || true

      - uses: actions/upload-artifact@v4
        with:
          name: mcsa-admin
          path: admin/build/libs/
          if-no-files-found: error

      - name: "失敗時: エラーをアノテーション化"
        if: failure()
        run: bash ci/annotate.sh admin/build-log.txt

  server:
    name: Server Plugin（Paper）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: ビルド
        working-directory: server
        run: |
          set -o pipefail
          gradle build --no-daemon --stacktrace 2>&1 | tee build-log.txt

      - name: plugin.yml を確認
        working-directory: server
        run: |
          set -euo pipefail
          ls -l build/libs
          unzip -p build/libs/mcsa-server-*.jar plugin.yml

      - name: "失敗時: エラーをアノテーション化"
        if: failure()
        run: bash ci/annotate.sh server/build-log.txt

      - uses: actions/upload-artifact@v4
        with:
          name: mcsa-server
          path: server/build/libs/*.jar
          if-no-files-found: error

  wrapper:
    name: Gradle Wrapper 生成（既存の Multi Build 用）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: ルートに wrapper を生成
        run: gradle wrapper --gradle-version "$GRADLE_VERSION" --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: gradle-wrapper
          path: |
            gradlew
            gradlew.bat
            gradle/wrapper/**
          if-no-files-found: error
